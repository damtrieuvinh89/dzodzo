function lifecycleModal(){return `<div class="overlay" data-action="close-overlay-lc"><section role="dialog" aria-modal="true" aria-label="Vòng đời kèo" class="modal"><div class="modal-head"><h2>Vòng đời kèo <span class="demo-ribbon">V1.2.1</span></h2><button class="btn ghost sm" data-action="close-lifecycle" aria-label="Đóng">← Quay lại</button></div><div class="modal-body"><div class="lc-steps" style="margin-bottom:12px"><span class="lc-step">Đang mở</span><span class="lc-arrow">→</span><span class="lc-step">Đủ người</span><span class="lc-arrow">→</span><span class="lc-step">Đang diễn ra</span><span class="lc-arrow">→</span><span class="lc-step">Kết thúc</span><span class="lc-arrow">·</span><span class="lc-step">Đã huỷ</span></div><ol class="lc-rules"><li><b>Tạo kèo là xong:</b> chủ kèo <b>không cần bấm Bắt đầu hay Kết thúc</b>. Tới giờ hẹn kèo tự hiện Đang diễn ra, qua giờ kết thúc tự chuyển Kết thúc, đủ người tự hiện Đủ người. Giờ kết thúc chọn giờ nào cũng được — nhỏ hơn giờ bắt đầu thì tính là kết thúc rạng sáng hôm sau.</li><li><b>Không thông báo che màn hình:</b> có người xin vào, rời kèo, hay kèo bị huỷ — tất cả chỉ hiện <b>chấm đỏ + số hoạt động mới</b> trên thẻ kèo và ghi vào mục Hoạt động trong trang chi tiết của kèo. Rảnh lúc nào xem lúc đó.</li><li><b>Duyệt thong thả:</b> yêu cầu xin vào nằm sẵn trong mục Yêu cầu của kèo (tab Kèo của tôi) — chủ kèo duyệt hoặc từ chối lúc nào cũng được, không bị thúc.</li><li><b>Huỷ & rời — trừ vùng sát giờ:</b> còn <b>hơn 30 phút</b> trước giờ bắt đầu thì chủ kèo huỷ / thành viên rời tự do, không cần lý do. Vào vùng <b>30 phút sát giờ</b> hoặc kèo đang diễn ra thì <b>không huỷ/rời trực tiếp trên app được nữa</b> — phải nhắn trong chat bàn để báo mọi người, tránh cảnh cả bàn đã ra tới quán mà kèo biến mất. (Rút yêu cầu khi chưa được duyệt thì lúc nào cũng được.) Trường hợp <b>bất khả kháng</b> (ốm, việc gia đình, quán đóng cửa…) vẫn có lối thoát: bấm <b>Huỷ/Rời khẩn cấp</b> và <b>bắt buộc ghi lý do</b> — cả bàn được báo ngay kèm lý do, nhưng lần đó bị ghi vào hồ sơ; huỷ sát giờ <b>2 lần trong 30 ngày</b> thì bị <b>tạm khoá tạo kèo 7 ngày</b>.</li><li><b>Cập nhật tức thì:</b> ai vào, ai ra, còn bao nhiêu chỗ — thẻ kèo tự cập nhật ngay, kèm chấm đỏ cho chủ kèo biết có biến mới.</li><li><b>Tạo kèo cần liên kết Facebook:</b> chỉ tài khoản đã xác thực SĐT <b>và</b> liên kết Facebook mới được làm chủ kèo — người tổ chức chịu trách nhiệm với buổi gặp. Tham gia kèo thì không cần liên kết FB.</li><li><b>Giới hạn kèo:</b> mỗi người <b>tạo tối đa 3 kèo</b> đang hoạt động và <b>tham gia tối đa 3 kèo</b> của người khác — để kèo nào cũng chất lượng, không ôm đồm. Duyệt người, huỷ kèo hay rời kèo đều có pop-up nhỏ xác nhận ngay trong màn hình.</li></ol><p style="font-size:12px;color:#9eacc4;line-height:1.7">Thử ngay: kèo mẫu trong tab Kèo của tôi đang có chấm đỏ vì có 2 người chờ duyệt — mở chi tiết kèo để xem mục Hoạt động.</p></div></section></div>`}
function joinedStatus(e){return e.isMine?'host':e.joined?'approved':state.joins[e.id]||null}
function audienceMatches(filter,audience){if(filter==='all')return true;audience=String(audience||'Tất cả');if(filter==='male')return audience==='Chỉ nam';if(filter==='female')return audience==='Chỉ nữ';if(filter==='lgbt')return audience==='LGBT+ thân thiện';return true}
function radarEvents(){return state.events.filter(e=>!e.isMine&&!e.joined&&e.city===state.city&&(state.area==='all'||e.area===state.area)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,5)}
function radarCandidates(){return state.events.filter(e=>!e.isMine&&!e.joined&&e.city===state.city&&(state.area==='all'||e.area===state.area)&&spots(e)>0).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));}
function radarPoints(){let arr=radarCandidates();if(state.gpsOn&&state.gps){arr=arr.filter(e=>Number.isFinite(e.lat)&&Number.isFinite(e.long)&&haversine(state.gps,{lat:e.lat,long:e.long})<=state.radarRadius)}return arr.slice(0,12).map((e,i)=>{let d=state.gpsOn&&state.gps?haversine(state.gps,{lat:e.lat,long:e.long}):null;let angle=d!==null?Math.atan2((e.long-state.gps.long)*Math.cos(e.lat*Math.PI/180),e.lat-state.gps.lat):i*2.39996+.8;let distanceFactor=d!==null?Math.max(.15,Math.min(.94,d/state.radarRadius)):.26+(i%4)*.19;let x=50+Math.sin(angle)*distanceFactor*43,y=50-Math.cos(angle)*distanceFactor*43;return {e,d,x,y}})}
function radarMarkup(){const points=radarPoints();const active=state.radarActive;return `<section class="radar-module" aria-label="Radar khu vực tìm kèo"><div class="radar-heading"><div><div class="radar-eyebrow"><span class="radar-live-dot"></span> RADAR KHU VỰC · DEMO</div><h2>⌖ Quét kèo quanh đây <span class="radar-heading-range">(${state.radarRadius} km)</span></h2><p>${state.gpsOn?'Đã bật GPS · khoảng cách tính từ vị trí thiết bị':'Chưa bật GPS · kèo hiển thị theo khu vực, vị trí chấm trên radar chỉ minh họa'}</p></div><div class="radar-controls"><button class="radar-range ${state.radarRadius===5?'chosen':''}" data-action="radar-radius" data-value="5">5 km</button><button class="radar-range ${state.radarRadius===10?'chosen':''}" data-action="radar-radius" data-value="10">10 km</button><button class="btn primary sm" data-action="radar-scan">⌖ ${state.radarActive?'Quét lại':'Tìm xung quanh'}</button></div></div><div class="radar-board ${active?'radar-is-on':''}"><div class="radar-grid"></div><div class="radar-circle outer"></div><div class="radar-circle middle"></div><div class="radar-circle inner"></div>${active?'<div class="radar-sweep"></div>':''}<div class="radar-distance outer-label">${state.radarRadius} km</div><div class="radar-distance middle-label">${state.radarRadius/2} km</div><span class="radar-corner a">${esc(state.area==='all'?fmtCity(state.city):state.area)}</span><span class="radar-corner b">KÈO ĐANG MỞ</span><div class="radar-origin"><span>⌖</span><small>${state.gpsOn?'Vị trí của bạn':'Tâm radar minh họa'}</small></div>${active?points.map(({e,d,x,y})=>`<button class="radar-marker" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%" data-action="detail" data-id="${esc(e.id)}" title="${esc(e.title)}" aria-label="Mở kèo ${esc(e.title)}"><span class="radar-marker-dot">🍻</span><b>${e.members}/${e.max}</b><small>${d===null?esc(e.area):d.toFixed(1)+' km'}</small></button>`).join(''):''}${active&&points.length===0?`<div class="radar-empty">Chưa có kèo phù hợp trong ${state.radarRadius} km.<small>Thử 10 km hoặc đổi khu vực.</small></div>`:''}${!active?'<div class="radar-prompt"><span>⌖</span><b>Nhấn “Tìm xung quanh” để quét kèo</b><small>Chọn 5 km hoặc 10 km trước khi quét</small></div>':''}</div><div class="radar-footer"><div><span class="radar-live-dot"></span> ${active?points.length+' kèo đang mở trong dữ liệu mẫu':'Sẵn sàng tìm kèo quanh đây'}</div><button data-action="toggle-gps" class="radar-gps">${state.gpsOn?'✓ GPS đang bật · Tắt':'⌖ Bật GPS để lọc khoảng cách thật'}</button></div></section>`}
const VENUE_BY_ID={e1:'Bar',e2:'Acoustic',e3:'Quán nhậu',e4:'Cà phê',e5:'Acoustic',e6:'Mini bar',e15:'Club',e16:'Karaoke',e7:'Quán nhậu',e8:'Cà phê',e9:'Quán nhậu',e10:'Mini bar',e11:'Quán nhậu',e12:'Bar',e13:'Bia hơi / Vỉa hè',e14:'Quán nhậu'};
function venueOf(e){if(e.venue)return e.venue;if(VENUE_BY_ID[e.id])return VENUE_BY_ID[e.id];let s=((e.place||'')+' '+(e.title||'')+' '+(e.type||'')).toLocaleLowerCase('vi');if(s.includes('karaoke'))return 'Karaoke';if(s.includes('club'))return 'Club';if(s.includes('mini bar'))return 'Mini bar';if(s.includes('bia hơi')||s.includes('vỉa hè'))return 'Bia hơi / Vỉa hè';if(s.includes('cà phê')||s.includes('cafe')||s.includes('coffee'))return 'Cà phê';if(s.includes('acoustic'))return 'Acoustic';if(s.includes('bar'))return 'Bar';return 'Quán nhậu'}
function eventFilter(e){if(e.isMine||e.joined) return false;let _st=statusOf(e);if(_st==='done'||_st==='cancelled')return false;if(e.city!==state.city)return false;if(state.area!=='all'&&state.area!==e.area)return false;if(state.dateFilter==='today'&&e.date!==localDate())return false;if(state.billFilter!=='all'&&e.bill!==state.billFilter)return false;if(!audienceMatches(state.audienceFilter,e.audience))return false;if(state.venueFilter&&state.venueFilter!=='all'&&venueOf(e)!==state.venueFilter)return false;
if(state.tags.length&&!state.tags.every(t=>e.tags.includes(t)))return false;if(state.search){let q=state.search.toLocaleLowerCase('vi');if(![e.title,e.type,e.area,e.place,e.description,e.audience||'',...e.tags].join(' ').toLocaleLowerCase('vi').includes(q))return false}if(state.gpsOn&&state.gps){if(typeof e.lat==='number'){if(haversine(state.gps,{lat:e.lat,long:e.long})>state.distance)return false}else return false}return true}
function badgeFor(e){let st=statusOf(e);if(st==='live')return '<span class="badge orange">Đang diễn ra</span>';if(st==='done')return '<span class="badge gray">Đã kết thúc</span>';if(st==='cancelled')return '<span class="badge gray">Đã huỷ</span>';let s=joinedStatus(e);return s==='pending'?'<span class="badge orange">Đang chờ duyệt</span>':s==='waitlist'?'<span class="badge orange">Trong danh sách chờ</span>':s==='approved'?'<span class="badge green">Đã tham gia</span>':st==='full'?'<span class="badge gray">Đủ người · Có danh sách chờ</span>':`<span class="badge green">Còn ${spots(e)} chỗ</span>`}
function eventCard(e){let s=joinedStatus(e);return `<article class="event-card" data-action="detail" data-id="${esc(e.id)}" tabindex="0" role="button" aria-label="Xem chi tiết ${esc(e.title)}"><div class="event-top"><div style="min-width:0"><span class="event-type">${esc(e.type.toUpperCase())}</span><h3>${esc(e.title)}</h3><div class="event-meta"><span>📍 ${distanceText(e)}</span><span>🗓 ${formatDate(e.date)} · ${esc(e.start)}</span><span>👥 ${e.members}/${e.max}</span></div></div><div class="event-icon ${esc(e.tint||'gold')}">${esc(e.icon||'🍻')}</div></div><div class="tags">${e.tags.slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span class="tag">${esc(e.bill)}</span><span class="tag">👥 ${esc(e.audience||'Tất cả')}</span></div><div class="event-bottom"><div class="host-info"><div class="avatar ${esc(e.hostColor||'')}">${esc(e.initials||'DZ')}</div><div><div class="host-name">${esc(e.host)}</div><div class="host-note">${esc(fmtCity(e.city))} · ${esc(e.area)}</div></div></div><div class="event-actions">${badgeFor(e)}<button class="btn primary sm" data-action="${s==='pending'?'noop':s==='approved'?'chat-table':spots(e)===0?'noop':'join'}" data-id="${esc(e.id)}" ${s==='pending'||spots(e)===0&&!s?'disabled':''}>${s==='pending'?'Đã gửi yêu cầu':s==='approved'?'Nhắn tin':spots(e)===0?'Đã đầy':'Xin vào bàn'}</button></div></div></article>`}
function filterMarkup(){return `<div class="panel"><div class="panel-title">Bộ lọc tìm kèo <button class="linkbtn" data-action="reset-filters">Đặt lại</button></div><div class="field"><label>Thành phố trực thuộc TW</label><select class="control select" data-filter="city">${cityOpts(state.city)}</select></div><div class="field"><label>Khu vực / tên quận huyện quen gọi</label><select class="control select" data-filter="area">${areaOptions(state.city,state.area)}</select></div><div class="field"><label>Bán kính khi bật GPS</label><div class="segmented">${RADIUS.map(n=>`<button class="chip ${state.distance===n?'active':''}" data-action="radius" data-value="${n}">${n} km</button>`).join('')}</div><small>${state.gpsOn?'Đang lọc theo vị trí GPS trên thiết bị.':'Chưa bật GPS: đang lọc theo thành phố/khu vực.'}</small><button class="btn secondary sm" style="margin-top:9px" data-action="toggle-gps">${state.gpsOn?'◎ Tắt định vị':'⌖ Dùng vị trí của tôi'}</button></div><div class="field"><label>Thời điểm</label><div class="segmented">${[['all','Tất cả'],['today','Hôm nay']].map(([v,l])=>`<button class="chip ${state.dateFilter===v?'active':''}" data-action="date-filter" data-value="${v}">${l}</button>`).join('')}</div></div><div class="field"><label>Quy tắc hóa đơn</label><select class="control select" data-filter="bill"><option value="all">Tất cả</option>${opts(Object.keys(BILL),state.billFilter)}</select></div><div class="field"><label>Filter đối tượng</label><div class="segmented">${AUDIENCE_FILTERS.map(([v,l])=>`<button class="chip ${state.audienceFilter===v?'active':''}" data-action="audience-filter" data-value="${v}">${l}</button>`).join('')}</div><small>Chọn nhanh các kèo dành cho nam, nữ hoặc không gian LGBT+ thân thiện.</small></div><div class="field"><label>Dạng quán</label><div class="segmented">${['all',...VENUE_TYPES].map(v=>`<button class="chip ${state.venueFilter===v?'active':''}" data-action="venue-filter" data-value="${esc(v)}">${v==='all'?'Tất cả':esc(v)}</button>`).join('')}</div></div><div class="field"><label>Gu & không gian</label><div class="segmented">${TAGS.map(t=>`<button class="chip ${state.tags.includes(t)?'active':''}" data-action="filter-tag" data-value="${esc(t)}">${esc(t)}</button>`).join('')}</div></div></div>`}
function discover(){let ev=state.events.filter(eventFilter).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));let radar=radarEvents();return `<section class="hero"><div class="hero-content"><div class="hero-kicker">WELCOME TO DZODZO</div><h1>Bạn hợp gu, kèo hợp ý.<br>Vui là phải có hội! ✨</h1><p>Khám phá những cuộc hẹn gần bạn, chọn đúng không khí và chủ động kết nối.</p><div class="hero-actions"><button class="btn cream" data-action="tab" data-tab="create">＋ Tạo kèo của bạn</button><button class="btn outline" style="border-color:#ffffff7a;color:#fff" data-action="open-chat">💬 Chat khu vực</button></div></div><div class="hero-visual"><div class="hero-halo"><div class="hero-bubbles">🍻</div></div><div class="float-note a">🌿 Chill đúng gu</div><div class="float-note b">✦ Kết nối tự nhiên</div></div></section>${radarMarkup()}<div class="content-grid"><aside class="filter-sidebar">${filterMarkup()}</aside><div class="center-column"><div class="section-bar"><div><h2>Kèo đang chờ bạn</h2><p>Khám phá ở ${esc(fmtCity(state.city))}${state.area==='all'?'':' · '+esc(state.area)} ${state.gpsOn?'· GPS '+state.distance+' km':''}</p></div><div class="section-actions"><span class="count">${ev.length} kèo mẫu</span><button class="btn secondary sm filter-trigger" data-action="open-filter">☷ Lọc</button></div></div><div class="searchbox"><span class="search-icon">⌕</span><input class="control" id="search-input" placeholder="Tìm theo gu, chủ đề, địa điểm..." value="${esc(state.search)}" aria-label="Tìm kèo"></div><div class="event-list" id="event-list">${ev.length?ev.map(eventCard).join(''):`<div class="empty"><div class="big">🌿</div><h3>Chưa thấy kèo phù hợp</h3><p>Thử đổi thành phố, khu vực, bán kính hoặc bỏ bớt bộ lọc.</p><button class="btn secondary sm" data-action="reset-filters">Đặt lại bộ lọc</button></div>`}</div></div><aside class="right-stack"><div class="info-card"><h3>💬 Chat khu vực</h3><p>Chọn thành phố và khu vực. Vào phòng chung chỉ bằng một biểu tượng chat, không làm rối trang chủ.</p><div class="mini-area"><span class="tiny muted">Bạn đang xem</span><b>${esc(fmtCity(state.city))}</b><p>${state.area==='all'?'Phòng chat toàn thành phố':esc(state.area)}</p></div><button class="btn secondary sm wide" style="margin-top:12px" data-action="open-chat">Mở phòng chat</button></div><div class="info-card"><h3>🛡️ Kết nối văn minh</h3><ul><li>Chỉ dành cho người đủ 18 tuổi.</li><li>Không ép uống, tôn trọng nhau.</li><li>Đã uống đồ có cồn thì không lái xe.</li><li>Chi tiết điểm hẹn nên chia sẻ riêng sau khi duyệt.</li></ul></div></aside></div>`}
function create(){let d=state.draft||(state.draft=newDraft());let radiusArea=areaList(d.city);if(!radiusArea.includes(d.area)) d.area=radiusArea[0];
let fbStrip=!state.account?`<div class="check-card" style="margin-bottom:14px">Để <b>tạo kèo</b> cần: đăng ký thành viên (xác thực SĐT) <b>và liên kết Facebook</b> — người tổ chức chịu trách nhiệm với buổi gặp. Tham gia kèo thì không cần liên kết FB.</div>`:(state.account.fb?'':`<div class="check-card" style="margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="flex:1;min-width:200px">Tài khoản của bạn <b>chưa liên kết Facebook</b> — liên kết xong mới đăng kèo được.</span><button type="button" class="btn sm" data-action="profile-fb-connect" style="background:#2559ad;color:#fff">Liên kết Facebook ngay</button></div>`);return `<div class="page-head"><div><div class="eyebrow">Host your vibe</div><h1 class="page-title">Tạo kèo mới 🍻</h1><p class="page-sub">3 phần ngắn gọn để mọi người tìm thấy đúng kèo của bạn.</p></div><span class="demo-ribbon">BẢN DEMO</span></div>${fbStrip}<div class="form-layout"><div class="form-card"><form id="create-form"><div class="form-section"><div class="section-index"><span>01</span> Kèo gì, ở đâu?</div><div class="field"><label for="f-title">Tên kèo *</label><input required maxlength="90" id="f-title" name="title" class="control" placeholder="Ví dụ: Bia tối & chuyện cuối tuần" value="${esc(d.title)}"></div><div class="field"><label for="f-type">Loại buổi gặp</label><select id="f-type" name="type" class="control select">${opts(['Gặp gỡ / Chill','Bia & Ẩm thực','Craft Beer','Xem thể thao','Cà phê / Không cồn'],d.type)}</select></div><div class="field"><label for="f-venue">Dạng quán</label><select id="f-venue" name="venue" class="control select">${opts(VENUE_TYPES,d.venue||'Quán nhậu')}</select></div><div class="split"><div class="field"><label for="f-city">Thành phố *</label><select id="f-city" name="city" class="control select">${cityOpts(d.city)}</select></div><div class="field"><label for="f-area">Khu vực *</label><select id="f-area" name="area" class="control select">${areaOptions(d.city,d.area,false)}</select></div></div><div class="split"><div class="field"><label for="f-ward">Phường/xã hoặc địa danh</label><input class="control" id="f-ward" name="ward" maxlength="100" placeholder="Ví dụ: Thảo Điền" value="${esc(d.ward)}"></div><div class="field"><label for="f-place">Điểm hẹn dự kiến *</label><input class="control" required id="f-place" name="place" maxlength="120" placeholder="Tên khu vực/quán" value="${esc(d.place)}"></div></div><p class="form-hint">Vì địa giới đã thay đổi, bạn có thể chọn tên khu vực quen gọi và ghi thêm phường/xã hiện hành. Không cần công khai địa chỉ quá chi tiết.</p><div class="field" style="margin-top:14px"><label>Bán kính tìm người tham gia</label><div class="segmented">${RADIUS.map(n=>`<button type="button" class="chip ${+d.radius===n?'active':''}" data-action="draft-radius" data-value="${n}">${n} km</button>`).join('')}</div><p class="form-hint">Bán kính là mức bạn muốn mời người ở gần. Bản demo chưa gửi thông báo đến người dùng khác.</p></div><div class="field" style="margin-top:12px"><label>Địa điểm: dự kiến hoặc vị trí hiện tại</label><button type="button" class="btn secondary sm" data-action="draft-geolocate">⌖ ${d.lat!=null?'Đã chọn GPS hiện tại · chọn lại':'Dùng vị trí hiện tại (GPS)'}</button><p class="form-hint">Không bắt buộc bật GPS. Chọn thành phố/khu vực phía trên để đăng kèo theo địa điểm dự kiến.</p></div></div><div class="form-section"><div class="section-index"><span>02</span> Khi nào, mấy người?</div><div class="split"><div class="field"><label for="f-date">Ngày gặp *</label><input class="control" id="f-date" name="date" type="date" min="${localDate()}" required value="${esc(d.date)}"></div><div class="field"><label for="f-max">Tổng số người *</label><select name="max" id="f-max" class="control select">${opts(['2','3','4','5','6','7','8','9','10','12','15','20'],String(d.max))}</select></div></div><div class="split"><div class="field"><label for="f-start">Bắt đầu (24h) *</label><input class="control" id="f-start" name="start" type="text" inputmode="numeric" maxlength="5" placeholder="19:30" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" title="Nhập giờ dạng 24h, ví dụ 19:30" required value="${esc(d.start)}"><small>Nhập dạng HH:MM · 00:00–23:59</small></div><div class="field"><label for="f-end">Kết thúc (24h) *</label><input class="control" id="f-end" name="end" type="text" inputmode="numeric" maxlength="5" placeholder="22:30" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" title="Nhập giờ dạng 24h, ví dụ 22:30" required value="${esc(d.end)}"><small>Giờ nào cũng được · nhỏ hơn/bằng giờ bắt đầu = qua đêm, kết thúc hôm sau</small></div></div></div><div class="form-section"><div class="section-index"><span>03</span> Luật kèo & gu chơi</div><div class="field"><label>Quy tắc chia hóa đơn *</label><div class="rule-grid">${Object.entries(BILL).map(([rule,desc])=>`<button type="button" class="rule-card ${d.bill===rule?'active':''}" data-action="draft-bill" data-value="${esc(rule)}"><span style="font-size:18px">${rule==='Campuchia'?'🧾':rule==='Chủ kèo Mời'?'🎁':'⚖️'}</span><strong>${esc(rule)}</strong><small>${esc(desc)}</small></button>`).join('')}</div></div><div class="field"><label for="f-audience">Đối tượng muốn mời</label><select id="f-audience" name="audience" class="control select">${opts(['Tất cả','Chỉ nam','Chỉ nữ','Nam & nữ','LGBT+ thân thiện'],d.audience||'Tất cả')}</select><p class="form-hint">Lựa chọn giúp mô tả kèo rõ ràng; LGBT+ thân thiện là không gian chào đón, không phải một giới tính.</p></div><div class="field"><label>Chọn gu / không gian</label><div class="segmented">${TAGS.map(t=>`<button type="button" class="chip ${d.tags.includes(t)?'active':''}" data-action="draft-tag" data-value="${esc(t)}">${esc(t)}</button>`).join('')}</div></div><div class="field"><label for="f-description">Mô tả thêm</label><textarea id="f-description" name="description" class="control textarea" maxlength="500" placeholder="Kèo này dành cho ai, lưu ý cần biết...">${esc(d.description)}</textarea></div></div><button type="button" class="btn primary wide" data-action="post-event">✦ Đăng kèo & quản lý thành viên</button><p class="form-hint">Đây là bản HTML demo: kèo được lưu trong trình duyệt của bạn, chưa phát sóng lên máy chủ.</p></form></div><aside class="summary-box"><h3>✦ Tóm tắt kèo</h3><div class="summary-row"><span>Thành phố</span><strong id="sum-city">${esc(fmtCity(d.city))}</strong></div><div class="summary-row"><span>Khu vực</span><strong id="sum-area">${esc(d.area)}</strong></div><div class="summary-row"><span>Bán kính</span><strong id="sum-radius">${esc(d.radius)} km</strong></div><div class="summary-row"><span>Thời gian</span><strong id="sum-time">${esc(d.start)} – ${esc(d.end)}</strong></div><div class="summary-row"><span>Số người</span><strong id="sum-max">${esc(d.max)}</strong></div><div class="summary-row"><span>Hóa đơn</span><strong id="sum-bill">${esc(d.bill)}</strong></div><div class="summary-row"><span>Đối tượng</span><strong id="sum-audience">${esc(d.audience||'Tất cả')}</strong></div><div class="footer-safe">🛡️ Chỉ đăng kèo khi bạn đủ 18 tuổi. Hãy thống nhất chi phí và tuân thủ nguyên tắc đã uống đồ có cồn thì không lái xe.</div></aside></div>`}
function myCreateView(){return `<div class="backbar"><button class="btn primary sm" data-action="my-list">← Kèo của tôi</button><b style="margin-left:4px">Tạo kèo mới</b></div>`+create()}
function my(){if(state.myView==='create')return myCreateView();let mine=state.events.filter(e=>e.isMine);let joined=state.events.filter(e=>!e.isMine&&(e.joined||state.joins[e.id]));let c=e=>{let req=(e.requests||[]).filter(r=>r.status==='pending');let status=joinedStatus(e);let st=statusOf(e);return `<article class="my-card"><div class="my-head"><div><span class="badge ${e.isMine?'green':status==='approved'?'green':'orange'}">${e.isMine?'Bạn là chủ kèo':status==='approved'?'Đã duyệt':'Đang chờ duyệt'}</span><h3 style="margin-top:8px">${esc(e.title)}</h3>${unreadFor(e)?`<span class="notice-badge">${unreadFor(e)} hoạt động mới</span>`:``}</div><div class="event-icon ${esc(e.tint||'gold')}" style="width:52px;height:52px;font-size:25px">${esc(e.icon||'🍻')}</div></div><div class="my-info"><span>📍 ${esc(e.area)} · ${esc(fmtCity(e.city))}</span><span>🗓 ${formatDate(e.date)} · ${esc(e.start)}</span><span>👥 ${e.members}/${e.max}</span></div>${lcSteps(e)}<div class="event-actions" style="justify-content:flex-start"><button class="btn secondary sm" data-action="detail" data-id="${esc(e.id)}">Chi tiết</button>${(e.isMine||status==='approved')&&st!=='cancelled'?`<button class="btn primary sm" data-action="chat-table" data-id="${esc(e.id)}">💬 Chat bàn</button>`:''}${e.isMine?(st==='done'||st==='cancelled'?`<button class="btn warn sm" data-action="delete-event" data-id="${esc(e.id)}">Xóa kèo</button>`:`<button class="btn warn sm" data-action="lc-cancel" data-id="${esc(e.id)}">Huỷ kèo</button>`):status==='approved'?(st==='done'||st==='cancelled'?'':`<button class="btn ghost sm" data-action="leave" data-id="${esc(e.id)}">Rời kèo</button>`):status==='pending'||status==='waitlist'?`<button class="btn ghost sm" data-action="withdraw" data-id="${esc(e.id)}">${status==='waitlist'?'Rút khỏi danh sách chờ':'Rút yêu cầu'}</button>`:''}</div>${e.isMine&&(st==='open'||st==='full'||st==='live')?`<div class="requests"><div style="font-weight:800;font-size:12px;margin-bottom:4px">Yêu cầu vào bàn (${req.length})</div>${req.length?req.map(r=>`<div class="request-item"><div class="avatar peach">${esc(r.initials)}</div><div class="grow"><div class="name">${esc(r.name)}</div><div class="sub">Đang chờ bạn duyệt · Demo</div></div><div class="request-actions"><button class="btn ghost sm" data-action="request" data-decision="rejected" data-id="${esc(e.id)}" data-rid="${esc(r.id)}">Từ chối</button><button class="btn primary sm" data-action="request" data-decision="approved" data-id="${esc(e.id)}" data-rid="${esc(r.id)}">Duyệt</button></div></div>`).join(''):`<p class="muted small" style="padding:12px 0">Chưa có yêu cầu mới.</p>`}</div>`:''}</article>`};return `<div class="page-head"><div><div class="eyebrow">My gatherings</div><h1 class="page-title">Kèo của tôi</h1><p class="page-sub">Theo dõi yêu cầu, duyệt người tham gia và chat trong bàn.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary sm" data-action="lifecycle">🔄 Vòng đời kèo</button><button class="btn primary sm" data-action="tab" data-tab="create">＋ Tạo kèo</button></div></div><div class="my-grid"><div class="my-list"><h2 style="font-size:15px;margin-bottom:3px">Kèo bạn làm chủ (${mine.length})</h2><div class="my-cards">${mine.length?mine.map(c).join(''):`<div class="empty"><h3>Chưa có kèo nào</h3><p>Bạn có thể tự tạo kèo chỉ với vài thao tác.</p></div>`}</div><h2 style="font-size:15px;margin:16px 0 3px">Kèo bạn tham gia (${joined.length})</h2><div class="my-cards">${joined.length?joined.map(c).join(''):`<div class="empty"><h3>Chưa đăng ký kèo nào</h3><p>Hãy khám phá kèo phù hợp với gu của bạn.</p></div>`}</div></div><aside class="right-stack" style="display:grid"><div class="info-card"><h3>Luồng tham gia</h3><p>1. Gửi yêu cầu xin vào bàn.<br>2. Chủ kèo xem và duyệt.<br>3. Thành viên được duyệt mới có quyền chat bàn.</p></div><div class="info-card"><h3>Giữ kèo rõ ràng</h3><p>Mỗi kèo hiển thị số chỗ, thời gian, khu vực, gu và quy tắc chia hóa đơn để tránh hiểu nhầm.</p></div></aside></div>`}
function profile(){let mine=state.events.filter(e=>e.isMine), joined=state.events.filter(e=>e.joined||state.joins[e.id]==='approved');return `<div class="page-head"><div><div class="eyebrow">My profile</div><h1 class="page-title">Hồ sơ thành viên</h1><p class="page-sub">Quản lý trải nghiệm và nguyên tắc cộng đồng.</p></div></div><div class="profile-grid"><div class="profile-card"><div class="profile-hero">${state.account&&state.account.photos&&state.account.photos[0]?`<img class="avatar" src="${state.account.photos[0]}" alt="" style="object-fit:cover;padding:0">`:`<div class="avatar" style="background:var(--green);color:#fff">DZ</div>`}<div><h2>${state.account?esc(state.account.displayName):'Thành viên DzoDzo'}</h2><p>${state.account?('Đã xác thực OTP · '+esc(state.account.phoneMasked)):'Hồ sơ demo · Chưa xác thực tài khoản thực'}</p></div></div>${state.account?`${(state.account.photos||[]).length?`<div class="reg-photos" style="margin-bottom:10px">${state.account.photos.map(p=>`<img class="reg-photo" src="${p}" alt="Ảnh thành viên">`).join('')}</div>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px"><span class="badge green">Đã xác thực</span><span class="badge gray">${esc(state.account.area||'')}</span>${state.account.fb?`<span class="badge" style="background:#2559ad;color:#fff">Đã liên kết Facebook</span>`:`<button class="btn sm" data-action="profile-fb-connect" style="background:#2559ad;color:#fff">Liên kết Facebook</button>`}${(()=>{let c30=(state.account.emg||[]).filter(x=>Date.now()-x.at<=30*86400000).length;return c30?`<span class="badge orange">Huỷ/rời sát giờ: ${c30} lần</span>`:``})()}<button class="btn warn sm" data-action="delete-account">Xoá tài khoản & dữ liệu</button></div>`:`<button class="btn primary wide" style="margin-bottom:6px" data-action="member">Đăng ký / Xác thực tài khoản</button>`}<div class="profile-stats"><div><b>${mine.length}</b><small>Kèo tạo</small></div><div><b>${joined.length}</b><small>Đã tham gia</small></div><div><b>${Object.keys(state.joins).filter(id=>state.joins[id]==='pending').length}</b><small>Chờ duyệt</small></div></div><div class="line"></div><div class="profile-row"><span>Trạng thái</span><strong>Khám phá tự do</strong></div><div class="profile-row"><span>Phiên bản</span><strong>V1.2.1 demo</strong></div><div class="profile-row"><span>Khu vực chọn</span><strong>${esc(fmtCity(state.city))}</strong></div><div class="profile-row"><span>GPS</span><strong>${state.gpsOn?'Đang bật':'Tắt'}</strong></div><div class="profile-row"><span>Dữ liệu</span><button class="linkbtn" data-action="reset-demo">Đặt lại dữ liệu demo</button></div></div><div class="profile-card"><h2 style="font-size:16px;margin-bottom:14px">🛡️ Nguyên tắc DzoDzo</h2><div class="inline-note" style="margin-bottom:14px">✦ Mục tiêu là gặp gỡ văn minh, có thể chọn đồ uống không cồn. Không có cơ chế chấm điểm tửu lượng hay ép uống.</div><div class="profile-row"><span>Độ tuổi sử dụng</span><strong>18+</strong></div><div class="profile-row"><span>Ứng xử</span><strong>Tôn trọng, không quấy rối</strong></div><div class="profile-row"><span>Chi phí</span><strong>Thống nhất trước khi gặp</strong></div><div class="profile-row"><span>Di chuyển</span><strong>Đã uống thì không lái xe</strong></div><p class="muted small" style="margin-top:18px;line-height:1.8">Bản HTML này là bản mẫu chạy trên thiết bị. Chat, duyệt kèo và dữ liệu lưu cục bộ; để hoạt động nhiều người thực tế cần backend, đăng nhập, xác thực độ tuổi và hệ thống kiểm duyệt.</p></div></div>`}
function header(){return `<header class="topbar"><div class="top-inner"><a class="brand" href="#" data-action="tab" data-tab="discover" aria-label="DzoDzo trang chủ"><div class="brandmark"><span>🍻</span></div><div><div class="brandname">Dzo<b>Dzo</b></div><div class="brand-sub">HẸN MỘT KÈO VUI · V1.2.1</div></div></a><nav class="desktop-nav" aria-label="Điều hướng chính">${[['discover','Khám phá'],['my','Kèo của tôi'],['venues','Quán ngon'],['games','Mini game'],['news','Bản tin'],['profile','Hồ sơ']].map(([t,l])=>`<button class="navlink ${state.tab===t?'active':''}" data-action="tab" data-tab="${t}">${l}</button>`).join('')}</nav><div class="top-actions"><button class="icon-btn" data-action="open-chat" aria-label="Mở tin nhắn">${icon('chat')}${totalUnread()?`<span class="notify-dot">${totalUnread()}</span>`:``}</button><button class="userpill" data-action="member">${state.account&&state.account.photos&&state.account.photos[0]?`<img class="avatar" src="${state.account.photos[0]}" alt="" style="object-fit:cover;padding:0">`:`<span class="avatar">DZ</span>`}<span>${state.account?esc(state.account.displayName):'Thành viên'}</span></button></div></div></header>`}
function mobileNav(){return `<nav class="mobile-nav" aria-label="Điều hướng trên điện thoại">${[['discover','◈','Khám phá'],['my','▤','Kèo của tôi'],['venues','🍺','Quán ngon'],['games','🎮','Game'],['news','📰','Bản tin'],['profile','♙','Hồ sơ']].map(([t,i,l])=>`<button class="mob-nav-btn ${state.tab===t?'active':''}" data-action="tab" data-tab="${t}"><span>${i}</span><span>${l}</span></button>`).join('')}</nav>`}

function venuesPage(){let cs=['Tất cả',...Object.keys(CITIES)];let as=state.venueCity==='Tất cả'?['Tất cả']:['Tất cả',...areaList(state.venueCity)];if(!as.includes(state.venueArea))state.venueArea='Tất cả';
let list=VENUES.filter(v=>(state.venueCity==='Tất cả'||v.city===state.venueCity)&&(state.venueArea==='Tất cả'||v.area===state.venueArea));
let ordered=[...list.filter(v=>v.ad),...list.filter(v=>!v.ad)];
let card=v=>`<div class="venue-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3 style="margin:0;font-size:16px">${esc(v.name)}${v.ad?'<span class="ad-badge">Ad</span>':''}</h3><span style="color:#f5a623;font-weight:800;white-space:nowrap">★ ${v.rating}</span></div><p style="margin:7px 0;line-height:1.6;color:#c9d6ee">${esc(v.desc)}</p><div class="small" style="color:var(--muted);line-height:1.7">📍 ${esc(v.addr)}, ${esc(v.ward)}, ${esc(v.area)}, ${esc(fmtCity(v.city))}<br>☎ Hotline: <a href="tel:${v.phone.replace(/\s/g,'')}" style="color:#4a8df9;font-weight:700;text-decoration:none">${esc(v.phone)}</a></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center">${v.tags.map(tg=>`<span class="badge gray">${esc(tg)}</span>`).join('')}<a class="btn primary sm" href="tel:${v.phone.replace(/\s/g,'')}" style="margin-left:auto;text-decoration:none">📞 Gọi quán</a></div></div>`;
return `<div class="page-head"><div><div class="eyebrow">Địa điểm</div><h1 class="page-title">Quán ngon 🍺</h1><p class="page-sub">Danh sách quán hợp để lên kèo. Quán đối tác chạy quảng cáo được ghim lên đầu và gắn nhãn Ad cho minh bạch.</p></div></div>
<div class="venue-filters"><div class="field"><label>Tỉnh / Thành phố</label><select class="control select" id="v-city">${cs.map(c=>`<option ${c===state.venueCity?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Quận / Huyện</label><select class="control select" id="v-area">${as.map(c=>`<option ${c===state.venueArea?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
${ordered.length?ordered.map(card).join(''):`<div class="empty"><h3>Chưa có quán ở khu vực này</h3><p>Thử chọn tỉnh/thành hoặc quận/huyện khác nhé.</p></div>`}
<p class="small" style="color:var(--muted)">Dữ liệu quán đang là dữ liệu mẫu trong bản demo.</p>`}
document.addEventListener('change',event=>{if(event.target.id==='v-city'){state.venueCity=event.target.value;state.venueArea='Tất cả';render()}if(event.target.id==='v-area'){state.venueArea=event.target.value;render()}});

function evStart(e){return new Date(e.date+'T'+(e.start||'00:00')+':00')}
function askInfo(e){let st=statusOf(e);let mins=(evStart(e)-Date.now())/60000;return{st,mins,blocked:st==='live'||mins<=30}}
function emgCancels(acc){return ((acc&&acc.emg)||[]).filter(x=>x.kind==='cancel').map(x=>x.at).sort((a,b)=>a-b)}
function createLocked(acc){let c=emgCancels(acc);if(c.length<2)return 0;let last=c[c.length-1],prev=c[c.length-2];if(last-prev<=30*86400000){let until=last+7*86400000;if(Date.now()<until)return until}return 0}
function emgModal(a,e,isC){let reasons=isC?['Ốm / sức khoẻ đột xuất','Việc gia đình khẩn cấp','Quán đóng cửa / hết bàn','Tai nạn / sự cố di chuyển','Lý do khác']:['Ốm / sức khoẻ đột xuất','Việc gia đình khẩn cấp','Tai nạn / sự cố di chuyển','Lý do khác'];
return `<div class="overlay" data-action="close-overlay-ask"><section role="dialog" aria-modal="true" aria-label="Huỷ khẩn cấp" class="modal"><div class="modal-head"><h2>${isC?'Huỷ':'Rời'} khẩn cấp ⚠️</h2><button class="btn ghost sm" data-action="ask-close" aria-label="Đóng">← Quay lại</button></div><div class="modal-body"><p style="line-height:1.7;margin-top:0">Kèo <b>${esc(e.title)}</b> đã sát giờ. Chỉ dùng lối này cho trường hợp <b>bất khả kháng</b> thật sự.</p><div class="field"><label>Lý do khẩn cấp *</label><select class="control select" id="emg-reason">${reasons.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="field"><label>Ghi rõ thêm (bắt buộc nếu chọn “Lý do khác”)</label><input class="control" id="emg-note" placeholder="VD: nhập viện cấp cứu, quán báo đóng cửa…"></div><div class="check-card" style="text-align:left"><b>Lưu ý:</b><ul style="margin:8px 0 0;padding-left:18px;line-height:1.8"><li>${isC?'Cả bàn':'Chủ kèo'} được thông báo <b>ngay lập tức kèm lý do</b> của bạn.</li><li>Lần ${isC?'huỷ':'rời'} sát giờ này <b>ghi vào hồ sơ</b> tài khoản.</li><li>Huỷ sát giờ <b>2 lần trong 30 ngày</b> → tạm <b>khoá tạo kèo 7 ngày</b>.</li></ul></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn warn" data-action="ask-emg-confirm">Xác nhận ${isC?'huỷ':'rời'} khẩn cấp</button><button class="btn ghost" data-action="ask-emg-back">Quay lại</button></div></div></section></div>`}
function askModal(){if(state.askAction&&state.askAction.mode==='emg'){let e0=state.events.find(x=>x.id===state.askAction.id);if(e0)return emgModal(state.askAction,e0,state.askAction.kind==='cancel')}let a=state.askAction;if(!a)return '';let e=state.events.find(x=>x.id===a.id);if(!e)return '';let inf=askInfo(e);let isC=a.kind==='cancel';let title=isC?'Huỷ kèo này?':'Rời kèo này?';let whenTxt=inf.st==='live'?'Kèo đang diễn ra.':('Còn khoảng '+Math.max(0,Math.round(inf.mins))+' phút nữa kèo bắt đầu.');
return `<div class="overlay" data-action="close-overlay-ask"><section role="dialog" aria-modal="true" aria-label="${title}" class="modal"><div class="modal-head"><h2>${title}</h2><button class="btn ghost sm" data-action="ask-close" aria-label="Đóng">← Quay lại</button></div><div class="modal-body"><p style="line-height:1.7;margin-top:0"><b>${esc(e.title)}</b><br><span class="small" style="color:var(--muted)">${whenTxt}</span></p><div class="check-card" style="text-align:left"><b>Điều kiện ${isC?'huỷ':'rời'} kèo:</b><ul style="margin:8px 0 0;padding-left:18px;line-height:1.8"><li>Còn <b>hơn 30 phút</b> trước giờ bắt đầu: ${isC?'huỷ':'rời'} tự do, không cần lý do.</li><li>Còn <b>30 phút trở xuống</b>, hoặc kèo <b>đang diễn ra</b>: không ${isC?'huỷ':'rời'} trực tiếp trên app được nữa — hãy nhắn trong <b>Chat bàn</b> để báo cho mọi người.</li></ul></div>${inf.blocked?`<p style="line-height:1.7;color:#ffb3c0">⏰ Hiện tại đang ở vùng sát giờ — hệ thống <b>không cho ${isC?'huỷ':'rời'}</b> kèo này trên app.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-action="ask-close">Đã hiểu</button><button class="btn secondary" data-action="ask-chat">💬 Mở chat bàn</button><button class="btn warn" data-action="ask-emergency">Vẫn phải ${isC?'huỷ':'rời'} — trường hợp khẩn cấp</button></div>`:`<p class="small" style="color:var(--muted);line-height:1.7">Hành động này sẽ hiện chấm đỏ thông báo cho ${isC?'các thành viên trong kèo':'chủ kèo và các thành viên'}.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn warn" data-action="ask-confirm">${isC?'Huỷ kèo':'Rời kèo'}</button><button class="btn ghost" data-action="ask-close">Giữ lại</button></div>`}</div></section></div>`}
function checkMemberAlert(){if(state.memberAlert)return;for(let e of state.events){let n=(state.notices[e.id]||[]).find(x=>x.unread&&!x.alertShown&&((x.kind==='emg-cancel'&&!e.isMine)||(x.kind==='emg-leave'&&e.isMine)));if(n){n.alertShown=true;state.memberAlert={title:n.kind==='emg-cancel'?'⚠️ Kèo bạn tham gia đã bị huỷ khẩn cấp':'⚠️ Một thành viên vừa rời kèo khẩn cấp',text:n.t,preview:false};persist();break}}}
function memberAlertModal(){let m=state.memberAlert;if(!m)return '';return `<div class="overlay"><section role="dialog" aria-modal="true" aria-label="Thông báo khẩn" class="modal"><div class="modal-body" style="text-align:center;padding-top:22px"><div style="font-size:42px">⚠️</div><h2 style="margin:8px 0 6px">${esc(m.title)}</h2>${m.preview?`<p class="small" style="color:var(--muted);margin:0 0 6px">${esc(m.caption||'Pop-up này đang bật lên trên máy của các thành viên trong bàn ngay lúc này.')}</p>`:''}<p style="line-height:1.7">${esc(m.text)}</p><button class="btn primary wide" data-action="member-alert-close">Đã hiểu</button></div></section></div>`}
// Delegated handlers keep the single HTML usable without any JS framework or API server.
document.addEventListener('click',event=>{let el=event.target.closest('[data-action]');if(!el)return;if(el.tagName==='A')event.preventDefault();if(el.dataset.action==='close-overlay'&&event.target!==el)return;event.preventDefault();event.stopPropagation();doAction(el)});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&(state.chatOpen||state.detailId||state.filterOpen||state.regOpen||state.lcOpen)){state.chatOpen=false;state.detailId=null;state.filterOpen=false;state.regOpen=false;state.lcOpen=false;render()}if(event.key==='Enter'&&event.target.matches('.event-card')){state.detailId=event.target.dataset.id;render()}});
document.addEventListener('change',event=>{let el=event.target;if(el.dataset.filter){let v=el.value;if(el.dataset.filter==='city'){state.city=v;state.area='all';state.gpsOn=false;state.gps=null;state.radarActive=false}else if(el.dataset.filter==='area'){state.area=v;state.radarActive=false}else if(el.dataset.filter==='bill')state.billFilter=v;persist();render();return}if(el.dataset.chat){if(el.dataset.chat==='city'){state.city=el.value;state.area='all';persist()}else if(el.dataset.chat==='area'){state.area=el.value;persist()}else state.chatTable=el.value;render();return}if(el.closest('#create-form')&&state.draft){state.draft[el.name]=el.value;if(el.name==='city'){state.draft.area=areaList(el.value)[0];render();return}updateSummary()}});
document.addEventListener('input',event=>{let el=event.target;if(el.id==='search-input'){state.search=el.value;let node=$('#event-list'),ev=state.events.filter(eventFilter);if(node)node.innerHTML=ev.length?ev.map(eventCard).join(''):'<div class="empty"><div class="big">🌿</div><h3>Không tìm thấy kèo phù hợp</h3><p>Hãy thử từ khóa khác hoặc đổi bộ lọc.</p></div>';let counter=$('.count');if(counter)counter.textContent=ev.length+' kèo mẫu';return}if(el.closest('#create-form')&&state.draft){state.draft[el.name]=el.value;updateSummary()}});
document.addEventListener('invalid',event=>{let el=event.target;if(el.closest&&el.closest('#create-form')){let lab=(el.closest('.field')?.querySelector('label')?.textContent||'một mục').replace('*','').trim();try{el.scrollIntoView({block:'center'})}catch(e){}toast('Chưa đăng được — kiểm tra lại mục: '+lab+'.')}},true);
document.addEventListener('change',event=>{if(event.target.id==='reg-photo-input'){captureReg();handleRegPhotos(event.target.files);event.target.value=''}});
document.addEventListener('submit',event=>{if(event.target.id==='create-form'){event.preventDefault();saveEvent()}if(event.target.id==='chat-form'){event.preventDefault();sendChat()}if(event.target.id==='register-form'){event.preventDefault();submitRegister()}});
render();
})();
</script></body></html>
